[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "automotive-ocr-bench"
version = "0.1.0"
description = "Local automotive HMI OCR benchmark workbench"
requires-python = ">=3.10,<3.15"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "python-multipart>=0.0.18", "Pillow>=11", "numpy>=2", "opencv-python-headless>=4.10", "psutil>=6", "scipy>=1.14", "regex>=2024.11", "shapely>=2"]

[project.optional-dependencies]
rapidocr = ["rapidocr>=3.10,<4", "onnxruntime>=1.20,<2"]
rapidocr-gpu = ["rapidocr>=3.10,<4", "onnxruntime-gpu[cuda,cudnn]==1.31.0"]
easyocr = ["easyocr>=1.7,<2"]
easyocr-gpu = ["easyocr==1.7.2"]
paddleocr = ["paddleocr>=3,<4", "paddlepaddle>=3,<4"]
paddleocr-gpu = ["paddleocr>=3.7,<3.8"]
tesseract = ["pytesseract>=0.3.13"]
test = ["pytest>=8", "httpx>=0.28"]

[project.scripts]
ocr-bench = "ocrbench.__main__:main"

[tool.setuptools.package-data]
ocrbench = ["static/*"]

[tool.setuptools.packages.find]
include = ["ocrbench*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
